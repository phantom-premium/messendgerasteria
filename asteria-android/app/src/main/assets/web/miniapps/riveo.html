<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифровой ID</title>
<style>
  :root { --blue:#0a5cf0; --blue2:#0b3fc4; --ink:#16161d; --dim:#6d6d7c; --card:#fff; --danger:#e5384a; --ok:#1faa59; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:var(--ink); }
  body { background:#f4f4fa; overflow:hidden; }
  .hidden { display:none !important; }

  /* Фон: светлый сверху, к низу — глубокий сине-фиолетовый градиент с мягким бликом */
  .app { position:relative; height:100%; display:flex; flex-direction:column; overflow:hidden;
    background:linear-gradient(180deg,#f7f7fb 0%,#f1f1f8 30%,#d9d5f6 48%,#8a78e6 66%,#4a2fcf 82%,#2a239e 100%); }
  .app::before { content:''; position:absolute; right:-18%; bottom:-6%; width:80%; height:46%; border-radius:50%; pointer-events:none;
    background:radial-gradient(closest-side,rgba(59,130,246,.75),rgba(59,130,246,0)); filter:blur(14px); }
  .app::after { content:''; position:absolute; left:-25%; bottom:4%; width:70%; height:34%; border-radius:50%; pointer-events:none;
    background:radial-gradient(closest-side,rgba(168,85,247,.45),rgba(168,85,247,0)); filter:blur(18px); }
  .app > * { position:relative; z-index:1; }

  .bar { flex:none; display:flex; align-items:center; justify-content:center; position:relative; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px; }
  .bar h1 { margin:0; font-size:19px; font-weight:800; display:flex; align-items:center; gap:7px; }
  .vb { width:20px; height:20px; display:block; }
  .menu-btn { position:absolute; right:10px; top:calc(8px + env(safe-area-inset-top,0px)); width:42px; height:42px; border:none; background:none; border-radius:50%; cursor:pointer; display:grid; place-items:center; color:var(--ink); }
  .menu-btn:active { background:rgba(0,0,0,.06); }
  .menu-btn i { display:block; width:4px; height:4px; background:currentColor; border-radius:50%; box-shadow:0 7px 0 currentColor,0 -7px 0 currentColor; }
  .menu { position:absolute; right:12px; top:calc(54px + env(safe-area-inset-top,0px)); z-index:30; min-width:220px; background:#fff; border-radius:18px; padding:6px; box-shadow:0 14px 40px rgba(20,20,60,.22); }
  .menu button { display:block; width:100%; text-align:left; border:none; background:none; padding:13px 14px; border-radius:12px; font-size:16px; font-family:inherit; color:var(--ink); cursor:pointer; }
  .menu button:active { background:#f0f0f7; }

  .hero { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 22px; }
  .logo { width:112px; height:112px; margin-bottom:26px;
    background:linear-gradient(135deg,#8b3fe0 0%,#4b57e8 45%,#0aa5cf 100%);
    -webkit-mask:url(/assets/riveo-logo-mask.png) center/contain no-repeat; mask:url(/assets/riveo-logo-mask.png) center/contain no-repeat; }
  .hero h2 { margin:0 0 10px; font-size:29px; font-weight:800; letter-spacing:-.02em; }
  .hero p { margin:0 auto 26px; max-width:330px; font-size:17px; line-height:1.4; color:#34343f; }
  .btn { display:block; width:100%; max-width:480px; border:none; border-radius:24px; height:62px; font-size:19px; font-weight:700; font-family:inherit; cursor:pointer; transition:transform .12s; }
  .btn:active { transform:scale(.98); }
  .btn-main { color:#fff; background:linear-gradient(180deg,#1a6bff,#0a4fe0); box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 26px rgba(10,80,224,.35); }
  .btn-soft { margin-top:14px; color:var(--ink); background:rgba(255,255,255,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 22px rgba(30,30,90,.1); }

  /* Документы внизу — стеклянные круги с плюсиком */
  .docs { flex:none; display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x proximity; padding:6px 14px calc(26px + env(safe-area-inset-bottom,0px)); scrollbar-width:none; }
  .docs::-webkit-scrollbar { display:none; }
  .doc { flex:0 0 calc((100% - 18px) / 4); max-width:110px; min-width:76px; scroll-snap-align:start; background:none; border:none; padding:0; cursor:pointer; text-align:center; color:#fff; font-family:inherit; }
  .doc-c { position:relative; width:78px; height:78px; margin:0 auto 10px; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05)); border:1px solid rgba(255,255,255,.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.25); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:transform .15s; }
  .doc:active .doc-c { transform:scale(.93); }
  .doc-c svg { width:34px; height:34px; stroke:#fff; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; opacity:.92; }
  .doc-plus { position:absolute; right:-2px; top:-2px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.28); color:#fff; display:grid; place-items:center; font-size:20px; line-height:1; font-weight:300; }
  .doc.on .doc-plus { background:var(--ok); border-color:#fff; font-size:15px; font-weight:800; }
  .doc span { font-size:15px; font-weight:600; opacity:.88; }

  /* Нижние шторки и QR */
  .shade { position:fixed; inset:0; z-index:40; background:rgba(10,10,30,.5); display:flex; align-items:flex-end; justify-content:center; animation:fade .18s; }
  .shade.center { align-items:center; padding:20px; }
  @keyframes fade { from { opacity:0; } }
  .sheet { width:100%; max-width:560px; max-height:88%; overflow-y:auto; background:#fff; border-radius:28px 28px 0 0; padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px)); animation:up .25s cubic-bezier(.2,.9,.3,1); }
  @keyframes up { from { transform:translateY(40px); opacity:.4; } }
  .grab { width:42px; height:5px; border-radius:3px; background:#d6d6de; margin:0 auto 14px; }
  .sheet h3 { margin:0 0 4px; font-size:22px; font-weight:800; }
  .sheet .sub { color:var(--dim); font-size:15px; margin-bottom:6px; }
  .sum { display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; background:#f3f3f9; margin:12px 0; }
  .sum b { display:block; font-size:16px; } .sum small { color:var(--dim); font-size:13px; font-family:ui-monospace,Menlo,monospace; }
  .sum .ok { margin-left:auto; color:var(--ok); font-size:12px; font-weight:800; }
  label.f { display:block; font-size:12px; color:var(--dim); margin:12px 0 5px; }
  input { width:100%; background:#f3f3f9; border:1.5px solid transparent; color:var(--ink); border-radius:14px; padding:13px 14px; font-size:16px; font-family:inherit; outline:none; }
  input:focus { border-color:#7a6bf0; background:#fff; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row { display:flex; gap:10px; margin-top:16px; }
  .sb { flex:1; border:none; border-radius:16px; padding:15px; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; }
  .sb-p { background:linear-gradient(180deg,#1a6bff,#0a4fe0); color:#fff; }
  .sb-s { background:#eeeef6; color:var(--ink); }
  .sb-d { background:#fdecee; color:var(--danger); }
  .err { color:var(--danger); font-size:14px; min-height:18px; margin-top:10px; }
  .info li { margin:0 0 12px; font-size:15.5px; line-height:1.4; } .info { padding-left:20px; margin:12px 0 0; }
  .qrbox { width:100%; max-width:330px; background:#fff; border-radius:30px; padding:24px 22px; text-align:center; animation:up .25s; }
  .qrbox .who { font-weight:800; font-size:20px; } .qrbox .num { margin-top:3px; font-family:ui-monospace,Menlo,monospace; color:var(--dim); font-size:14px; letter-spacing:.1em; }
  #qrWrap { width:236px; height:236px; margin:16px auto 10px; border-radius:16px; overflow:hidden; } #qrWrap svg { width:100%; height:100%; display:block; }
  .ring { height:5px; border-radius:3px; background:#e8e8f2; overflow:hidden; } .ring i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#7a5cf5,#0aa5cf); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px; }
  .pad button { height:56px; border-radius:50%; border:none; background:#f0f0f7; font-size:24px; font-weight:500; cursor:pointer; font-family:inherit; }
  .pad button:active { background:#dcdcf0; }
  .dots { display:flex; justify-content:center; gap:14px; margin:16px 0 20px; } .dots i { width:14px; height:14px; border-radius:50%; border:2px solid #b4b4c4; } .dots i.f { background:#0a5cf0; border-color:#0a5cf0; }
  .shake { animation:shake .3s; } @keyframes shake { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
  .toast { position:fixed; left:50%; bottom:calc(120px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60; background:rgba(20,20,40,.92); color:#fff; padding:11px 18px; border-radius:999px; font-size:14px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <h1>Цифровой ID <svg class="vb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2f8cf5"/><path d="M7 12.4l3.2 3.2L17 8.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></h1>
    <button class="menu-btn" id="menuBtn" aria-label="Меню"><i></i></button>
  </div>
  <div class="menu hidden" id="menu">
    <button data-m="copy">Скопировать номер ID</button>
    <button data-m="share">Поделиться</button>
    <button data-m="pin" id="menuPin">PIN-замок</button>
  </div>

  <div class="hero">
    <div class="logo" role="img" aria-label="Цифровой ID"></div>
    <h2>QR вместо документов</h2>
    <p>Подтверждайте возраст и льготные статусы через QR-код</p>
    <button class="btn btn-main" id="createQr">Создать QR</button>
    <button class="btn btn-soft" id="moreBtn">Подробнее</button>
  </div>

  <div class="docs" id="docs"></div>
</div>

<div class="shade hidden" id="shade"><div class="sheet" id="sheet"></div></div>
<div class="shade center hidden" id="qrOv"><div class="qrbox">
  <div class="who" id="qrWho"></div><div class="num" id="qrNum"></div>
  <div id="qrWrap"></div>
  <div class="ring"><i id="qrRing"></i></div>
  <div style="color:#6d6d7c;font-size:13px;margin:8px 0 14px" id="qrTimer"></div>
  <button class="sb sb-s" style="width:100%" id="qrClose">Закрыть</button>
</div></div>
<div class="shade center hidden" id="pinOv"><div class="qrbox" id="pinBox">
  <div class="who" id="pinTitle">Введите PIN</div>
  <div class="dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pinPad"></div>
  <button class="sb sb-s" style="width:100%;margin-top:14px" id="pinCancel">Отмена</button>
</div></div>
<div class="toast hidden" id="toast"></div>

<script src="/qrcode.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
async function api(path, opts) {
  const res = await fetch(path, Object.assign({ credentials:'include', headers:{ 'Content-Type':'application/json' } }, opts || {}));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Ошибка запроса');
  return data;
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 2200); }

const SV = (p) => '<svg viewBox="0 0 24 24">' + p + '</svg>';
/* Документы: ключ, подпись, иконка, поля формы. kind: passport | doc | card */
const DOCS = [
  { k:'passport', kind:'passport', label:'Паспорт', icon:SV('<rect x="4.5" y="3.5" width="15" height="17" rx="3"/><circle cx="12" cy="10" r="2.6"/><path d="M8.5 16.5h7"/>') },
  { k:'snils', kind:'doc', label:'СНИЛС', ph:'000-000-000 00', icon:SV('<path d="M12 3.5l7 2.6v5.4c0 4.3-2.9 7.5-7 9-4.1-1.5-7-4.7-7-9V6.1z"/><path d="M9 12l2.2 2.2L15.5 10"/>') },
  { k:'inn', kind:'doc', label:'ИНН', ph:'12 цифр', icon:SV('<rect x="3" y="6" width="18" height="12" rx="3"/><text x="12" y="14.6" text-anchor="middle" font-size="6.4" font-weight="700" fill="#fff" stroke="none" font-family="Arial,sans-serif">ИНН</text>') },
  { k:'oms', kind:'doc', label:'ОМС', ph:'16 цифр', icon:SV('<path d="M9.5 4h5v5.5H20v5h-5.5V20h-5v-5.5H4v-5h5.5z"/>') },
  { k:'driver', kind:'doc', label:'Права', ph:'Серия и номер', icon:SV('<rect x="3.5" y="5.5" width="17" height="13" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.5-1.3 1.5-1.8 2.5-1.8s2 .5 2.5 1.8M14 10h4M14 13.5h3"/>') },
  { k:'foreign', kind:'doc', label:'Загранпаспорт', ph:'Серия и номер', icon:SV('<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 3.6 5.2 3.6 8.5s-1.1 6.1-3.6 8.5c-2.5-2.4-3.6-5.2-3.6-8.5S9.5 5.9 12 3.5z"/>') },
  { k:'card', kind:'card', label:'Карта', icon:SV('<rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/>') },
];
let me = null, profile = { passport:null, card:null, docs:{} };
const has = (d) => d.kind === 'passport' ? !!profile.passport : d.kind === 'card' ? !!profile.card : !!(profile.docs || {})[d.k];

function renderDocs() {
  $('docs').innerHTML = DOCS.map((d) => `<button class="doc${has(d) ? ' on' : ''}" data-doc="${d.k}"><div class="doc-c">${d.icon}<div class="doc-plus">${has(d) ? '✓' : '+'}</div></div><span>${d.label}</span></button>`).join('');
}

/* ---------- PIN-замок (хэш только на этом устройстве) ---------- */
const PIN_KEY = 'asteriaIdPinHash';
const getPin = () => { try { return localStorage.getItem(PIN_KEY); } catch (e) { return null; } };
async function hash(s) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('asteria-id:' + s)); return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2,'0')).join(''); } catch (e) { return 'x' + s; } }
function askPin(title) {
  return new Promise((resolve) => {
    let val = ''; $('pinTitle').textContent = title; $('pinOv').classList.remove('hidden');
    const dots = () => [...$('pinDots').children].forEach((d, i) => d.classList.toggle('f', i < val.length));
    const done = (v) => { $('pinOv').classList.add('hidden'); $('pinPad').onclick = null; $('pinCancel').onclick = null; resolve(v); };
    const pad = $('pinPad'); pad.innerHTML = '';
    ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach((k) => { const b = document.createElement('button'); b.textContent = k; if (!k) b.style.visibility = 'hidden'; b.dataset.k = k; pad.appendChild(b); });
    dots();
    pad.onclick = (e) => { const k = e.target.dataset && e.target.dataset.k; if (!k) return; if (k === '⌫') val = val.slice(0, -1); else if (val.length < 4) val += k; dots(); if (val.length === 4) setTimeout(() => done(val), 120); };
    $('pinCancel').onclick = () => done(null);
  });
}
async function unlock() {
  const h = getPin(); if (!h) return true;
  for (let i = 0; i < 3; i++) {
    const v = await askPin(i ? 'Неверный PIN, ещё раз' : 'Введите PIN');
    if (v === null) return false;
    if (await hash(v) === h) return true;
    $('pinBox').classList.add('shake'); setTimeout(() => $('pinBox').classList.remove('shake'), 320);
  }
  return false;
}
async function togglePin() {
  if (getPin()) { if (await unlock()) { try { localStorage.removeItem(PIN_KEY); } catch (e) {} toast('PIN-замок выключен'); } }
  else { const a = await askPin('Придумайте PIN (4 цифры)'); if (a === null) return; const b = await askPin('Повторите PIN');
    if (a === b) { try { localStorage.setItem(PIN_KEY, await hash(a)); } catch (e) {} toast('PIN-замок включён'); } else toast('PIN не совпал'); }
}

/* ---------- Номер ID и QR ---------- */
function idNumber() {
  if (!me) return '';
  let h = 0; for (const c of me.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return (String(h).padStart(10, '0').slice(-8) + String((h >>> 3) % 10000).padStart(4, '0')).replace(/(\d{4})(?=\d)/g, '$1 ');
}
let qrTimer = null;
function drawQr() {
  const payload = 'asteria-id:' + me.id + ':' + Math.floor(Date.now() / 30000);
  try { $('qrWrap').innerHTML = AsteriaQR.toSVG(payload, 6, 2); } catch (e) { $('qrWrap').textContent = 'QR недоступен'; }
}
function closeQr() { clearInterval(qrTimer); $('qrOv').classList.add('hidden'); }
$('createQr').onclick = async () => {
  if (!me || !(await unlock())) return;
  $('qrWho').textContent = me.displayName || me.username || '';
  $('qrNum').textContent = 'ID ' + idNumber();
  $('qrOv').classList.remove('hidden'); drawQr();
  const tick = () => { const left = 30 - (Math.floor(Date.now() / 1000) % 30); $('qrRing').style.width = (left / 30 * 100) + '%'; $('qrTimer').textContent = 'Код обновится через ' + left + ' с'; if (left === 30) drawQr(); };
  tick(); clearInterval(qrTimer); qrTimer = setInterval(tick, 1000);
};
$('qrClose').onclick = closeQr;

/* ---------- Меню ---------- */
$('menuBtn').onclick = (e) => { e.stopPropagation(); $('menuPin').textContent = getPin() ? 'Снять PIN-замок' : 'PIN-замок'; $('menu').classList.toggle('hidden'); };
document.addEventListener('click', (e) => { if (!e.target.closest('#menu') && !e.target.closest('#menuBtn')) $('menu').classList.add('hidden'); });
$('menu').onclick = async (e) => {
  const m = e.target.dataset.m; if (!m) return; $('menu').classList.add('hidden');
  if (m === 'copy') { try { await navigator.clipboard.writeText(idNumber().replace(/\s/g, '')); toast('Номер ID скопирован'); } catch (er) { toast(idNumber()); } }
  if (m === 'share') { const t = 'Мой цифровой ID в Asteria: ' + idNumber() + (me.username ? ' (@' + me.username + ')' : ''); if (navigator.share) { try { await navigator.share({ text: t }); } catch (er) {} } else { try { await navigator.clipboard.writeText(t); toast('Скопировано'); } catch (er) {} } }
  if (m === 'pin') togglePin();
};

/* ---------- Шторки ---------- */
function openSheet(html) { $('sheet').innerHTML = '<div class="grab"></div>' + html; $('shade').classList.remove('hidden'); $('sheet').scrollTop = 0; }
function closeSheet() { $('shade').classList.add('hidden'); }
$('shade').addEventListener('mousedown', (e) => { if (e.target === $('shade')) closeSheet(); });
$('shade').addEventListener('touchstart', (e) => { if (e.target === $('shade')) closeSheet(); }, { passive:true });

$('moreBtn').onclick = () => openSheet(`<h3>Как это работает</h3><div class="sub">Цифровой ID хранит ваши документы и показывает их по QR-коду.</div>
  <ul class="info"><li><b>Добавьте документы</b> — паспорт, СНИЛС, ИНН, ОМС, права, загранпаспорт и банковскую карту. Нажмите на круг внизу экрана.</li>
  <li><b>Создайте QR</b> — код обновляется каждые 30 секунд, поэтому старый скриншот не сработает.</li>
  <li><b>Включите PIN-замок</b> в меню «⋮» — тогда QR и данные откроются только после ввода кода.</li>
  <li><b>Всё зашифровано</b> — полный номер документа повторно не показывается, только маска. CVV карты мы не храним.</li></ul>
  <div class="row"><button class="sb sb-p" onclick="closeSheet()">Понятно</button></div>`);

function fld(id, label, ph, extra) { return `<label class="f">${label}</label><input type="text" id="${id}" placeholder="${ph || ''}" ${extra || ''}>`; }
function formFor(d) {
  if (d.kind === 'passport') return fld('pFullName', 'ФИО', 'Иванов Иван Иванович') + fld('pBirthDate', 'Дата рождения', 'ДД.ММ.ГГГГ')
    + `<div class="two"><div>${fld('pSeries', 'Серия', '00 00')}</div><div>${fld('pNumber', 'Номер', '000000')}</div></div>` + fld('pIssuedBy', 'Кем выдан', '')
    + `<div class="two"><div>${fld('pIssueDate', 'Дата выдачи', 'ДД.ММ.ГГГГ')}</div><div>${fld('pDeptCode', 'Код подразделения', '000-000')}</div></div>` + fld('pAddress', 'Адрес регистрации (необязательно)', '');
  if (d.kind === 'card') return fld('cHolder', 'Имя держателя', 'IVAN IVANOV') + fld('cNumber', 'Номер карты', '0000 0000 0000 0000', 'inputmode="numeric" maxlength="23"')
    + fld('cExpiry', 'Срок действия', 'ММ/ГГ', 'inputmode="numeric" maxlength="5"') + '<div class="sub" style="margin-top:8px">CVV/CVC не запрашивается.</div>';
  return fld('dNum', 'Номер', d.ph) + fld('dHolder', 'Владелец (необязательно)', '') + fld('dValid', 'Действует до (необязательно)', 'ДД.ММ.ГГГГ');
}
function summaryFor(d) {
  if (d.kind === 'passport') { const p = profile.passport; return p ? [p.fullName, '№ ' + p.numberMasked] : null; }
  if (d.kind === 'card') { const c = profile.card; return c ? [esc(c.brand) + ' •••• ' + esc(c.last4), esc(c.holder) + ' · до ' + esc(c.expiry)] : null; }
  const x = (profile.docs || {})[d.k]; return x ? [d.label, x.numberMasked + (x.validUntil ? ' · до ' + x.validUntil : '')] : null;
}
let sheetDoc = null;
async function openDoc(k) {
  const d = DOCS.find((x) => x.k === k); if (!d) return;
  if (!(await unlock())) return;
  sheetDoc = d;
  const s = summaryFor(d);
  if (s) {
    openSheet(`<h3>${d.label}</h3><div class="sub">Данные хранятся зашифрованно</div>
      <div class="sum"><div><b>${esc(s[0])}</b><small>${s[1]}</small></div><span class="ok">✓ ПРИВЯЗАН</span></div>
      <div class="row"><button class="sb sb-s" id="editDoc">Изменить</button><button class="sb sb-d" id="delDoc">Удалить</button></div>`);
    $('editDoc').onclick = () => showForm(d);
    $('delDoc').onclick = () => delDoc(d);
  } else showForm(d);
}
function showForm(d) {
  openSheet(`<h3>${profile && summaryFor(d) ? 'Изменить' : 'Добавить'}: ${d.label}</h3><div class="sub">Полный номер повторно не показывается</div>${formFor(d)}
    <div class="err" id="fErr"></div><div class="row"><button class="sb sb-s" onclick="closeSheet()">Отмена</button><button class="sb sb-p" id="saveDoc">Сохранить</button></div>`);
  const cn = $('cNumber'); if (cn) cn.oninput = () => { cn.value = cn.value.replace(/\D/g, '').slice(0, 19).replace(/(.{4})/g, '$1 ').trim(); };
  const ce = $('cExpiry'); if (ce) ce.oninput = () => { let v = ce.value.replace(/\D/g, '').slice(0, 4); if (v.length >= 3) v = v.slice(0, 2) + '/' + v.slice(2); ce.value = v; };
  $('saveDoc').onclick = () => saveDoc(d);
}
async function saveDoc(d) {
  const err = $('fErr'); err.textContent = '';
  const v = (id) => ($(id).value || '').trim();
  try {
    if (d.kind === 'passport') {
      const body = { fullName:v('pFullName'), birthDate:v('pBirthDate'), series:v('pSeries'), number:v('pNumber'), issuedBy:v('pIssuedBy'), issueDate:v('pIssueDate'), departmentCode:v('pDeptCode'), address:v('pAddress') };
      if (!body.fullName || !body.series || !body.number) { err.textContent = 'Заполните ФИО, серию и номер'; return; }
      profile.passport = (await api('/api/riveo/passport', { method:'POST', body:JSON.stringify(body) })).passport;
    } else if (d.kind === 'card') {
      const body = { holder:v('cHolder'), number:v('cNumber').replace(/\D/g, ''), expiry:v('cExpiry') };
      if (!body.holder || !body.number || !body.expiry) { err.textContent = 'Заполните все поля'; return; }
      profile.card = (await api('/api/riveo/card', { method:'POST', body:JSON.stringify(body) })).card;
    } else {
      const body = { number:v('dNum'), holder:v('dHolder'), validUntil:v('dValid') };
      profile.docs = profile.docs || {};
      profile.docs[d.k] = (await api('/api/riveo/doc/' + d.k, { method:'POST', body:JSON.stringify(body) })).doc;
    }
    closeSheet(); renderDocs(); toast('Сохранено');
  } catch (e) { err.textContent = e.message; }
}
async function delDoc(d) {
  if (!confirm('Удалить сохранённые данные?')) return;
  try {
    if (d.kind === 'passport') { await api('/api/riveo/passport', { method:'DELETE' }); profile.passport = null; }
    else if (d.kind === 'card') { await api('/api/riveo/card', { method:'DELETE' }); profile.card = null; }
    else { await api('/api/riveo/doc/' + d.k, { method:'DELETE' }); delete profile.docs[d.k]; }
    closeSheet(); renderDocs(); toast('Удалено');
  } catch (e) { toast(e.message); }
}
$('docs').addEventListener('click', (e) => { const b = e.target.closest('[data-doc]'); if (b) openDoc(b.dataset.doc); });

(async function init() {
  renderDocs();
  try {
    const [m, p] = await Promise.all([api('/api/me'), api('/api/riveo/me')]);
    me = m.user; profile = Object.assign({ passport:null, card:null, docs:{} }, p); renderDocs();
  } catch (e) { toast(e.message); }
})();
</script>
</body>
</html>
