name: Build release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
defaults:
  run:
    working-directory: asteria-android
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'   # та же версия, что в gradle-wrapper.properties
      - name: Generate Gradle wrapper (если ещё не закоммичен)
        run: |
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.7; fi
          chmod +x ./gradlew
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asteria-release-apk
          path: asteria-android/app/build/outputs/apk/release/*.apk
