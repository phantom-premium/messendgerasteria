<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифровой ID</title>
<style>
  :root {
    --bg: #0b0b0f; --card: #16161d; --card2: #1e1e28; --border: #2a2a36;
    --text: #f5f5f8; --text-dim: #9a9aa8; --accent: #ffffff; --accent-dim: #cfcfd8;
    --danger: #ef4444; --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { padding: 20px 16px 32px; }

  /* Логотип по центру мини-приложения (по центру сверху) */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 18px; }
  .hero img { width: 76px; height: 76px; border-radius: 20px; background: #000; margin-bottom: 10px; }
  .hero h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .2px; }
  .hero .sub { margin-top: 4px; font-size: 13px; color: var(--text-dim); }

  .muted { color: var(--text-dim); font-size: 13px; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .card-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .card-title .ic { font-size: 18px; line-height: 1; }

  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .status-empty { color: var(--text-dim); font-size: 13px; }
  .status-filled { font-size: 14px; }
  .status-filled .line1 { font-weight: 700; }
  .status-filled .line2 { color: var(--text-dim); font-size: 13px; margin-top: 2px; font-family: ui-monospace, Menlo, monospace; }
  .badge-ok { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ok); font-weight: 700; }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text] {
    width: 100%; background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent-dim); }
  label.field { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
  .btn { border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #fff; color: #0b0b0f; flex: 1; }
  .btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); flex: 1; }
  .btn-danger { background: rgba(239,68,68,.12); color: var(--danger); border: 1px solid rgba(239,68,68,.35); }
  .btn:disabled { opacity: .5; cursor: default; }
  .form { display: none; margin-top: 12px; }
  .form.open { display: block; }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 16px; }
  .ok-msg { color: var(--ok); font-size: 13px; margin-top: 8px; min-height: 16px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .security-note { display: flex; gap: 8px; align-items: flex-start; }
  .security-note .ic { font-size: 16px; flex-shrink: 0; }
</style>
</head>
<body>

  <div class="hero">
    <img src="/assets/riveo-logo.png" alt="Цифровой ID">
    <h1>Цифровой ID</h1>
    <div class="sub">Ваш ID в Asteria</div>
  </div>

  <div class="card">
    <div class="security-note muted">
      <span class="ic">🔒</span>
      <span>Данные хранятся в зашифрованном виде. Полный номер карты/паспорта нигде не показывается повторно — только маска. CVV мы никогда не запрашиваем и не храним.</span>
    </div>
  </div>

  <!-- Паспорт -->
  <div class="card">
    <div class="card-title"><span class="ic">📄</span>Паспортные данные</div>

    <div id="passportStatus" class="status-row">
      <div class="status-empty">Загрузка…</div>
    </div>

    <div class="btn-row" id="passportButtons" style="display:none;">
      <button class="btn btn-secondary" id="passportEditBtn">Изменить</button>
      <button class="btn btn-danger" id="passportDeleteBtn">Удалить</button>
    </div>
    <div class="btn-row" id="passportAddRow" style="display:none;">
      <button class="btn btn-primary" id="passportAddBtn">+ Привязать паспорт</button>
    </div>

    <div class="form" id="passportForm">
      <label class="field">ФИО</label>
      <input type="text" id="pFullName" placeholder="Иванов Иван Иванович">
      <label class="field">Дата рождения</label>
      <input type="text" id="pBirthDate" placeholder="ДД.ММ.ГГГГ">
      <div class="two-col">
        <div>
          <label class="field">Серия</label>
          <input type="text" id="pSeries" placeholder="00 00">
        </div>
        <div>
          <label class="field">Номер</label>
          <input type="text" id="pNumber" placeholder="000000">
        </div>
      </div>
      <label class="field">Кем выдан</label>
      <input type="text" id="pIssuedBy" placeholder="Название органа, выдавшего документ">
      <div class="two-col">
        <div>
          <label class="field">Дата выдачи</label>
          <input type="text" id="pIssueDate" placeholder="ДД.ММ.ГГГГ">
        </div>
        <div>
          <label class="field">Код подразделения</label>
          <input type="text" id="pDeptCode" placeholder="000-000">
        </div>
      </div>
      <label class="field">Адрес регистрации (необязательно)</label>
      <input type="text" id="pAddress" placeholder="Город, улица, дом">
      <div class="btn-row">
        <button class="btn btn-primary" id="passportSaveBtn">Сохранить</button>
        <button class="btn btn-secondary" id="passportCancelBtn">Отмена</button>
      </div>
      <div class="error" id="passportError"></div>
    </div>
  </div>

  <!-- Банковская карта -->
  <div class="card">
    <div class="card-title"><span class="ic">💳</span>Банковская карта</div>

    <div id="cardStatus" class="status-row">
      <div class="status-empty">Загрузка…</div>
    </div>

    <div class="btn-row" id="cardButtons" style="display:none;">
      <button class="btn btn-secondary" id="cardEditBtn">Изменить</button>
      <button class="btn btn-danger" id="cardDeleteBtn">Удалить</button>
    </div>
    <div class="btn-row" id="cardAddRow" style="display:none;">
      <button class="btn btn-primary" id="cardAddBtn">+ Привязать карту</button>
    </div>

    <div class="form" id="cardForm">
      <label class="field">Имя держателя</label>
      <input type="text" id="cHolder" placeholder="IVAN IVANOV">
      <label class="field">Номер карты</label>
      <input type="text" id="cNumber" inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="23">
      <label class="field">Срок действия</label>
      <input type="text" id="cExpiry" inputmode="numeric" placeholder="ММ/ГГ" maxlength="5">
      <div class="muted" style="margin-top:8px;">CVV/CVC не запрашивается — вводить его здесь не нужно.</div>
      <div class="btn-row">
        <button class="btn btn-primary" id="cardSaveBtn">Сохранить</button>
        <button class="btn btn-secondary" id="cardCancelBtn">Отмена</button>
      </div>
      <div class="error" id="cardError"></div>
    </div>
  </div>

<script>
  async function api(path, opts) {
    const res = await fetch(path, Object.assign({ credentials: 'include', headers: { 'Content-Type': 'application/json' } }, opts || {}));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Ошибка запроса');
    return data;
  }

  function el(id) { return document.getElementById(id); }

  function renderPassport(p) {
    el('passportForm').classList.remove('open');
    if (p) {
      el('passportStatus').innerHTML =
        '<div class="status-filled"><div class="line1">' + escapeHtml(p.fullName) + '</div>' +
        '<div class="line2">№ ' + escapeHtml(p.numberMasked) + '</div></div>' +
        '<span class="badge-ok">✓ Привязан</span>';
      el('passportButtons').style.display = 'flex';
      el('passportAddRow').style.display = 'none';
    } else {
      el('passportStatus').innerHTML = '<div class="status-empty">Не привязан</div>';
      el('passportButtons').style.display = 'none';
      el('passportAddRow').style.display = 'flex';
    }
  }

  function renderCard(c) {
    el('cardForm').classList.remove('open');
    if (c) {
      el('cardStatus').innerHTML =
        '<div class="status-filled"><div class="line1">' + escapeHtml(c.brand) + ' •••• ' + escapeHtml(c.last4) + '</div>' +
        '<div class="line2">до ' + escapeHtml(c.expiry) + '</div></div>' +
        '<span class="badge-ok">✓ Привязана</span>';
      el('cardButtons').style.display = 'flex';
      el('cardAddRow').style.display = 'none';
    } else {
      el('cardStatus').innerHTML = '<div class="status-empty">Не привязана</div>';
      el('cardButtons').style.display = 'none';
      el('cardAddRow').style.display = 'flex';
    }
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  async function load() {
    try {
      const data = await api('/api/riveo/me');
      renderPassport(data.passport);
      renderCard(data.card);
    } catch (e) {
      el('passportStatus').innerHTML = '<div class="status-empty">' + escapeHtml(e.message) + '</div>';
      el('cardStatus').innerHTML = '';
    }
  }

  el('passportAddBtn').addEventListener('click', () => { el('passportForm').classList.add('open'); });
  el('passportEditBtn').addEventListener('click', () => { el('passportForm').classList.add('open'); });
  el('passportCancelBtn').addEventListener('click', () => { el('passportForm').classList.remove('open'); el('passportError').textContent = ''; });

  el('passportSaveBtn').addEventListener('click', async () => {
    const errEl = el('passportError');
    errEl.textContent = '';
    const body = {
      fullName: el('pFullName').value.trim(),
      birthDate: el('pBirthDate').value.trim(),
      series: el('pSeries').value.trim(),
      number: el('pNumber').value.trim(),
      issuedBy: el('pIssuedBy').value.trim(),
      issueDate: el('pIssueDate').value.trim(),
      departmentCode: el('pDeptCode').value.trim(),
      address: el('pAddress').value.trim(),
    };
    if (!body.fullName || !body.series || !body.number) {
      errEl.textContent = 'Заполните ФИО, серию и номер';
      return;
    }
    try {
      const data = await api('/api/riveo/passport', { method: 'POST', body: JSON.stringify(body) });
      ['pFullName','pBirthDate','pSeries','pNumber','pIssuedBy','pIssueDate','pDeptCode','pAddress'].forEach((id) => { el(id).value = ''; });
      renderPassport(data.passport);
    } catch (e) { errEl.textContent = e.message; }
  });

  el('passportDeleteBtn').addEventListener('click', async () => {
    if (!confirm('Удалить сохранённые паспортные данные?')) return;
    try {
      await api('/api/riveo/passport', { method: 'DELETE' });
      renderPassport(null);
    } catch (e) { alert(e.message); }
  });

  el('cardAddBtn').addEventListener('click', () => { el('cardForm').classList.add('open'); });
  el('cardEditBtn').addEventListener('click', () => { el('cardForm').classList.add('open'); });
  el('cardCancelBtn').addEventListener('click', () => { el('cardForm').classList.remove('open'); el('cardError').textContent = ''; });

  el('cNumber').addEventListener('input', (e) => {
    const digits = e.target.value.replace(/\D/g, '').slice(0, 19);
    e.target.value = digits.replace(/(.{4})/g, '$1 ').trim();
  });
  el('cExpiry').addEventListener('input', (e) => {
    let digits = e.target.value.replace(/\D/g, '').slice(0, 4);
    if (digits.length >= 3) digits = digits.slice(0, 2) + '/' + digits.slice(2);
    e.target.value = digits;
  });

  el('cardSaveBtn').addEventListener('click', async () => {
    const errEl = el('cardError');
    errEl.textContent = '';
    const body = {
      holder: el('cHolder').value.trim(),
      number: el('cNumber').value.replace(/\D/g, ''),
      expiry: el('cExpiry').value.trim(),
    };
    if (!body.holder || !body.number || !body.expiry) {
      errEl.textContent = 'Заполните все поля';
      return;
    }
    try {
      const data = await api('/api/riveo/card', { method: 'POST', body: JSON.stringify(body) });
      el('cHolder').value = ''; el('cNumber').value = ''; el('cExpiry').value = '';
      renderCard(data.card);
    } catch (e) { errEl.textContent = e.message; }
  });

  el('cardDeleteBtn').addEventListener('click', async () => {
    if (!confirm('Удалить сохранённые данные карты?')) return;
    try {
      await api('/api/riveo/card', { method: 'DELETE' });
      renderCard(null);
    } catch (e) { alert(e.message); }
  });

  load();
</script>
</body>
</html>
